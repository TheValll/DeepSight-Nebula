# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
# NOTE - every numeric value here MUST be a double (2.0, not 2), otherwise
# move_group crashes at startup with an InvalidParameterTypeException.
# Arm position limits stay 10 raw servo units inside the hardware ranges (3 below the
# wrist, whose default pose sits near its limit) so servo overshoot stays legal.
joint_limits:
  gripper_left_joint:
    has_position_limits: true
    min_position: -0.013921
    max_position: 0.013921
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.5
  limb1_to_base_link_joint:
    has_position_limits: true
    min_position: -1.957838
    max_position: 1.979625
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 5.0
  limb2_to_limb1_joint:
    has_position_limits: true
    min_position: -1.707602
    max_position: 1.474622
    has_velocity_limits: true
    max_velocity: 2.7
    has_acceleration_limits: true
    max_acceleration: 5.0
  limb3_to_limb2_joint:
    has_position_limits: true
    min_position: -2.074000
    max_position: 2.024116
    has_velocity_limits: true
    max_velocity: 2.7
    has_acceleration_limits: true
    max_acceleration: 5.0
  limb4_to_limb3_joint:
    has_position_limits: true
    min_position: -1.850498
    max_position: 1.581294
    has_velocity_limits: true
    max_velocity: 2.7
    has_acceleration_limits: true
    max_acceleration: 5.0
  limb5_to_limb4_joint:
    has_position_limits: true
    min_position: -1.520636
    max_position: 1.323552
    has_velocity_limits: true
