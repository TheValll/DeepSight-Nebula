# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # Six sequential servo reads take about 26 ms with the Rust firmware.
    update_rate: 25  # Hz
    enforce_command_limits: true

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: position_controllers/GripperActionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - limb1_to_base_link_joint
      - limb2_to_limb1_joint
      - limb3_to_limb2_joint
      - limb4_to_limb3_joint
      - limb5_to_limb4_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
gripper_controller:
  ros__parameters:
    joint: gripper_left_joint
    # Do not report full closure while still millimetres from the target.
    goal_tolerance: 0.0005
    # Opening takes 1 s and closing takes 0.5 s. Confirm object contact
    # after 0.5 s without motion before returning the arm.
    stall_timeout: 0.5
    # A held ball prevents full closure; treat this as a completed grasp.
    allow_stalling: true
    # One raw encoder step at 25 Hz is about 0.00135 m/s.
    # Ignore this measurement jitter when detecting a stopped gripper.
    stall_velocity_threshold: 0.003
