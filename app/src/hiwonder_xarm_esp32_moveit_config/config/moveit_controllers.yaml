# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# The gripper servo takes 1 s to complete a physical movement. Keep MoveIt
# from cancelling the action before the gripper controller reaches its goal.
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 2.0
  # MoveIt refuses to execute (CONTROL_FAILED, -4) when the measured start
  # state differs from the planned one by more than this. The default 0.01 rad
  # is about 2 raw servo units: encoder jitter and the wrist sagging near its
  # limit in `default` exceed it. 0.03 rad is about 7 raw units.
  allowed_start_tolerance: 0.03

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - limb1_to_base_link_joint
      - limb2_to_limb1_joint
      - limb3_to_limb2_joint
      - limb4_to_limb3_joint
      - limb5_to_limb4_joint
  gripper_controller:
    type: GripperCommand
    joints:
      - gripper_left_joint
    action_ns: gripper_cmd
    default: true
